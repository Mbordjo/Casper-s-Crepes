<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Casper's Crepes</title>

    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="stylesheet" href="CSS/Loyalty.css">
    <link rel="stylesheet" href="CSS/Promotions.css">
    <link rel="stylesheet" href="CSS/Account.css">

</head>

<body>

<div class="phone">
    <main>
        <header class="page-header">
            <a href="Index.html" class="back-button">
            ←
            </a>
            <h1>Account</h1>
        </header>

        <section class="profile-card">
            <div class="profile-picture">
                <img
                    id="profile-picture"
                    src=""
                    alt="Profile Picture">
            </div>
            <h2 id="user-name"></h2>
            <p id="user-email"></p>
        </section>

        <section class="loyalty-card">
            <div class="card-icon">
                ⭐
            </div>
            <div>
                <h3>Loyalty Points</h3>
                <p
                    id="user-points"
                    class="points">
                </p>
            </div>
        </section>

        <section class="account-options">
            <a href="orders.html" class="account-option">
                <span>📦 My Orders</span>
                <span>›</span>
            </a>
            <a href="favorites.html" class="account-option">
                <span>❤️ Favorites</span>
                <span>›</span>
            </a>
            <a href="settings.html" class="account-option">
                <span>⚙ Settings</span>
                <span>›</span>
            </a>
        </section>

        <button class="logout-button">
            Log Out
        </button>
    </main>
</div>

<script src="js/Menu_Item.js"></script>
<script src="js/Menu.js"></script>
<script src="js/Cart.js"></script>
<script src="js/Script.js"></script>
<script src="js/Users.js"></script>
<script src="js/Account.js"></script>

</body>

</html>
